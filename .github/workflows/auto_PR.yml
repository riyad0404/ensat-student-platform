name: Auto Create Pull Request

on:
  push:
    branches:
      - 'feature/*'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          # Vérifier si un PR existe déjà
          existing_pr=$(gh pr list --head "$BRANCH" --base dev --json number --jq '.[0].number')
          
          if [ -z "$existing_pr" ]; then
            # Créer le PR s'il n'existe pas
            gh pr create \
              --title "Auto PR - $BRANCH vers dev" \
              --body "Pull Request générée automatiquement via CI
              
              **Branche source:** \`$BRANCH\`
              **Branche cible:** \`dev\`
              
              Commit: ${{ github.sha }}" \
              --base dev \
              --head "$BRANCH"
            echo " Pull Request créé avec succès"
          else
            echo " Un Pull Request existe déjà (#$existing_pr)"
          fi